<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Responsibilities can be nested</title><desc id="desc">Music encloses Mastering and Publication, each with its own Matters and Capacities.</desc><rect width="760" height="290" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="24" y="12" width="712" height="266" rx="8" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7"/><text x="40" y="37" font-size="16" text-anchor="start" fill="#E4EDF5">Music</text><rect x="54" y="58" width="312" height="202" rx="8" fill="#202D38" stroke="#A9C9E6" stroke-width="1.7"/><text x="70" y="83" font-size="16" text-anchor="start" fill="#E4EDF5">Mastering</text><rect x="394" y="58" width="312" height="202" rx="8" fill="#202D38" stroke="#A9C9E6" stroke-width="1.7"/><text x="410" y="83" font-size="16" text-anchor="start" fill="#E4EDF5">Publication</text><circle cx="113" cy="131" r="26" fill="#51462C" stroke="#E3CA85" stroke-width="1.7"/><text x="113" y="178" font-size="14" text-anchor="middle" fill="#E4EDF5">Audio mix</text><rect x="195" y="108" width="128" height="47" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="259" y="137" font-size="15" text-anchor="middle" fill="#E4EDF5">Normalize</text><circle cx="456" cy="131" r="26" fill="#51462C" stroke="#E3CA85" stroke-width="1.7"/><text x="456" y="178" font-size="14" text-anchor="middle" fill="#E4EDF5">Release</text><rect x="538" y="108" width="128" height="47" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="602" y="137" font-size="15" text-anchor="middle" fill="#E4EDF5">Publish</text></g></svg>