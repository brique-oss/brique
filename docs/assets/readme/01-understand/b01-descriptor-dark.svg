<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Elements carry meaning.</title><desc id="desc">Normalize is associated with a descriptor containing four axes: brique, objective, functional and subjective.</desc><rect width="760" height="290" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="54" y="121" width="128" height="47" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="118" y="150" font-size="15" text-anchor="middle" fill="#E4EDF5">Normalize</text><path d="M182 144H238" fill="none" stroke="#91A5B8" stroke-width="1.7" stroke-dasharray="3 5"/><rect x="238" y="20" width="468" height="250" rx="8" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7"/><rect x="251" y="35" width="442" height="46" rx="8" fill="#202D38" stroke="#91A5B8" stroke-width="1.7"/><text x="265" y="54" font-size="15" text-anchor="start" fill="#E4EDF5">brique</text><text x="402" y="64" font-size="14" text-anchor="start" fill="#E4EDF5">Identity and architectural definition</text><rect x="251" y="91" width="442" height="46" rx="8" fill="#51462C" stroke="#91A5B8" stroke-width="1.7"/><text x="265" y="110" font-size="15" text-anchor="start" fill="#E4EDF5">objective</text><text x="402" y="120" font-size="14" text-anchor="start" fill="#E4EDF5">Purpose and semantic qualifications</text><rect x="251" y="147" width="442" height="46" rx="8" fill="#202D38" stroke="#91A5B8" stroke-width="1.7"/><text x="265" y="166" font-size="15" text-anchor="start" fill="#E4EDF5">functional</text><text x="402" y="176" font-size="14" text-anchor="start" fill="#E4EDF5">Behavior and transformation</text><rect x="251" y="203" width="442" height="46" rx="8" fill="#202D38" stroke="#91A5B8" stroke-width="1.7"/><text x="265" y="222" font-size="15" text-anchor="start" fill="#E4EDF5">subjective</text><text x="402" y="232" font-size="14" text-anchor="start" fill="#E4EDF5">Situated judgments</text></g></svg>