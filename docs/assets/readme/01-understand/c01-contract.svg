<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">A Capacity expresses a contract.</title><desc id="desc">Normalize is expanded into a contract with inputs, outputs, invariants and success or failure conditions.</desc><rect width="760" height="260" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="24" y="104" width="144" height="48" rx="8" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="96.0" y="133.0" font-size="16" text-anchor="middle" fill="#354352">Normalize</text><path d="M168 128H202" stroke="#91A5B8" stroke-width="1.7" stroke-dasharray="5 4" fill="none"/><rect x="202" y="15" width="534" height="230" rx="8" fill="#EDF6EE" stroke="#598D69" stroke-width="1.7" /><text x="222" y="41" font-size="18" text-anchor="start" fill="#598D69">Transformation contract</text><rect x="222" y="57" width="494" height="35" rx="8" fill="#FFFFFF" stroke="#598D69" stroke-width="1.7" /><text x="234" y="79" font-size="14" text-anchor="start" fill="#598D69">Inputs</text><text x="370" y="79" font-size="14" text-anchor="start" fill="#354352">Audio mix · target loudness</text><rect x="222" y="100" width="494" height="35" rx="8" fill="#FFFFFF" stroke="#598D69" stroke-width="1.7" /><text x="234" y="122" font-size="14" text-anchor="start" fill="#598D69">Outputs</text><text x="370" y="122" font-size="14" text-anchor="start" fill="#354352">Result · declared Matter effects</text><rect x="222" y="143" width="494" height="35" rx="8" fill="#FFFFFF" stroke="#598D69" stroke-width="1.7" /><text x="234" y="165" font-size="14" text-anchor="start" fill="#598D69">Invariants</text><text x="370" y="165" font-size="14" text-anchor="start" fill="#354352">Preserve channel configuration</text><rect x="222" y="186" width="494" height="35" rx="8" fill="#FFFFFF" stroke="#598D69" stroke-width="1.7" /><text x="234" y="208" font-size="14" text-anchor="start" fill="#598D69">Success / failure</text><text x="370" y="208" font-size="14" text-anchor="start" fill="#354352">Explicit conditions of the transformation</text></g></svg>