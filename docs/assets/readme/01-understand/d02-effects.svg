<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244" role="img" aria-labelledby="title desc"><title id="title">Transformations can modify substance.</title><desc id="desc">Two successive states of the same audio mix are shown around Normalize; the arrows represent an illustrative transformation, not two distinct Matters.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#B97B4E"/></marker><marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#527EA9"/></marker></defs><rect width="760" height="244" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="24" y="12" width="712" height="218" rx="8" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="42" y="37" font-size="16" fill="#527EA9" text-anchor="start">Mastering — successive states of the same Matter</text><circle cx="125" cy="110" r="26" fill="#FFF9E5" stroke="#AD943D" stroke-width="1.7"/><text x="125" y="157" font-size="14" fill="#354352" text-anchor="middle">Audio mix · before</text><rect x="290" y="89" width="180" height="42" rx="8" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="380.0" y="115" font-size="16" fill="#354352" text-anchor="middle">Normalize</text><circle cx="635" cy="110" r="26" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="635" y="157" font-size="14" fill="#354352" text-anchor="middle">Audio mix · after</text><path d="M151 110H290" fill="none" stroke="#B97B4E" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M470 110H609" fill="none" stroke="#B97B4E" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arr)" /><text x="380" y="189" font-size="15" fill="#354352" text-anchor="middle">Contractual effects, not automatic persistence</text></g></svg>