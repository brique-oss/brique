<svg xmlns="http://www.w3.org/2000/svg" width="760" height="229" viewBox="0 0 760 229" role="img" aria-labelledby="title desc"><title id="title">Activity produces observable outcomes.</title><desc id="desc">An Intention mobilizes Normalize, which returns a Response; a separate Trace records execution when enabled.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#F0B990"/></marker><marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#A9C9E6"/></marker></defs><rect width="760" height="229" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="24" y="12" width="184" height="45" rx="8" fill="#654636" stroke="#F0B990" stroke-width="1.7" /><text x="116" y="40" font-size="16" fill="#E4EDF5" text-anchor="middle">Intention</text><rect x="288" y="14" width="184" height="42" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7" /><text x="380.0" y="40" font-size="16" fill="#E4EDF5" text-anchor="middle">Normalize</text><rect x="552" y="12" width="184" height="45" rx="8" fill="#385875" stroke="#A9C9E6" stroke-width="1.7" /><text x="644" y="40" font-size="16" fill="#E4EDF5" text-anchor="middle">Response</text><path d="M208 35H288" fill="none" stroke="#F0B990" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M472 35H552" fill="none" stroke="#A9C9E6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ret)" /><text x="644" y="79" font-size="14" fill="#A9C9E6" text-anchor="middle">status + payload</text><path d="M380 56V110" fill="none" stroke="#A9C9E6" stroke-width="1.7" stroke-linejoin="round"  stroke-dasharray="4 4"/><rect x="24" y="110" width="712" height="103" rx="8" fill="#202D38" stroke="#91A5B8" stroke-width="1.7" /><text x="42" y="133" font-size="15" fill="#A9C9E6" text-anchor="start">Trace (when recorded)</text><path d="M48 174H145V154H245V185H350V163H460V180H580V150H710" fill="none" stroke="#A9C9E6" stroke-width="1.7" stroke-linejoin="round"  /></g></svg>