<svg xmlns="http://www.w3.org/2000/svg" width="760" height="229" viewBox="0 0 760 229" role="img" aria-labelledby="title desc"><title id="title">Activity produces observable outcomes.</title><desc id="desc">An Intention mobilizes Normalize, which returns a Response; a separate Trace records execution when enabled.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#B97B4E"/></marker><marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#527EA9"/></marker></defs><rect width="760" height="229" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="24" y="12" width="184" height="45" rx="8" fill="#F5D0B4" stroke="#B97B4E" stroke-width="1.7" /><text x="116" y="40" font-size="16" fill="#354352" text-anchor="middle">Intention</text><rect x="288" y="14" width="184" height="42" rx="8" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="380.0" y="40" font-size="16" fill="#354352" text-anchor="middle">Normalize</text><rect x="552" y="12" width="184" height="45" rx="8" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="644" y="40" font-size="16" fill="#354352" text-anchor="middle">Response</text><path d="M208 35H288" fill="none" stroke="#B97B4E" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M472 35H552" fill="none" stroke="#527EA9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ret)" /><text x="644" y="79" font-size="14" fill="#527EA9" text-anchor="middle">status + payload</text><path d="M380 56V110" fill="none" stroke="#527EA9" stroke-width="1.7" stroke-linejoin="round"  stroke-dasharray="4 4"/><rect x="24" y="110" width="712" height="103" rx="8" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="42" y="133" font-size="15" fill="#527EA9" text-anchor="start">Trace (when recorded)</text><path d="M48 174H145V154H245V185H350V163H460V180H580V150H710" fill="none" stroke="#527EA9" stroke-width="1.7" stroke-linejoin="round"  /></g></svg>