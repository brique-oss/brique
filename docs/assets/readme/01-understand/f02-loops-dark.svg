<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296" role="img" aria-labelledby="title desc"><title id="title">The world evolves through recursive loops.</title><desc id="desc">Possible movements between clarification, formalization, implementation, execution and observation, with returns to earlier levels.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#A9C9E6"/></marker></defs><rect width="760" height="296" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="720" height="244" rx="8" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" stroke-dasharray="none"/><text x="35" y="34" font-size="15" fill="#A9C9E6" text-anchor="start">One situated responsibility</text><rect x="40" y="58" width="196" height="45" rx="8" fill="#402E27" stroke="#F0B990" stroke-width="1.7" stroke-dasharray="none"/><text x="138" y="86" font-size="17" fill="#E4EDF5" text-anchor="middle">Clarification</text><rect x="282" y="58" width="196" height="45" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7" stroke-dasharray="none"/><text x="380" y="86" font-size="17" fill="#E4EDF5" text-anchor="middle">Formalization</text><rect x="524" y="58" width="196" height="45" rx="8" fill="#385875" stroke="#A9C9E6" stroke-width="1.7" stroke-dasharray="none"/><text x="622" y="86" font-size="17" fill="#E4EDF5" text-anchor="middle">Implementation</text><rect x="282" y="174" width="196" height="45" rx="8" fill="#51462C" stroke="#E3CA85" stroke-width="1.7" stroke-dasharray="none"/><text x="380" y="202" font-size="17" fill="#E4EDF5" text-anchor="middle">Observation</text><rect x="524" y="174" width="196" height="45" rx="8" fill="#402E27" stroke="#F0B990" stroke-width="1.7" stroke-dasharray="none"/><text x="622" y="202" font-size="17" fill="#E4EDF5" text-anchor="middle">Execution</text><path d="M236 80H282" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M478 80H524" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M622 103V174" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M524 197H478" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M282 197H138V103" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M380 174V103" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="380" y="145" font-size="15" fill="#A9C9E6" text-anchor="middle">Reconsider the relevant grain</text><text x="380" y="280" font-size="15" fill="#91A5B8" text-anchor="middle">Possible movements — not a mandatory sequence</text></g></svg>