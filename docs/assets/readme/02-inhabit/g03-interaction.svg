<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">Actors perceive, decide and act.</title><desc id="desc">An actor perceives the audio mix, decides within delegated authority, and addresses an Intention to Normalize.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="280" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="20" y="115" width="720" height="150" rx="8" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7"/><text x="35" y="138" font-size="16" fill="#527EA9" text-anchor="start">Music</text><rect x="35" y="150" width="345" height="102" rx="8" fill="#FFFFFF" stroke="#527EA9" stroke-width="1.7"/><text x="50" y="172" font-size="15" fill="#527EA9" text-anchor="start">Mastering</text><circle cx="88" cy="206" r="20" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="88" y="239" font-size="13" fill="#354352" text-anchor="middle">Audio mix</text><rect x="160" y="185" width="180" height="42" rx="8" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7"/><text x="250.0" y="211" font-size="16" fill="#354352" text-anchor="middle">Normalize</text><rect x="395" y="150" width="330" height="102" rx="8" fill="#FFFFFF" stroke="#527EA9" stroke-width="1.7"/><text x="410" y="172" font-size="15" fill="#527EA9" text-anchor="start">Publication</text><rect x="420" y="185" width="146" height="42" rx="8" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7"/><text x="493.0" y="211" font-size="16" fill="#354352" text-anchor="middle">Publish</text><circle cx="658" cy="206" r="20" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="658" y="239" font-size="13" fill="#354352" text-anchor="middle">Release</text><rect x="270" y="12" width="220" height="43" rx="22" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7"/><text x="380" y="39" font-size="17" fill="#354352" text-anchor="middle">Actor</text><path d="M68 206H12V79H315V55" stroke="#527EA9" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#b)"/><text x="113" y="70" font-size="15" fill="#527EA9" text-anchor="start">Perception</text><path d="M445 55V95H250V185" stroke="#B97B4E" stroke-width="2" stroke-dasharray="none" fill="none" marker-end="url(#o)"/><text x="460" y="84" font-size="15" fill="#B97B4E" text-anchor="start">Intention</text><text x="380" y="109" font-size="14" fill="#354352" text-anchor="middle">Decision within delegated authority</text></g></svg>