<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">The LLM decides. Brique materializes and executes.</title><desc id="desc">An LLM interprets information and sends an Intention to Normalize in the Music world; Brique executes the transformation.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#A9C9E6"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#F0B990"/></marker></defs><rect width="760" height="260" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="20" y="135" width="720" height="110" rx="8" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7"/><text x="35" y="156" font-size="15" fill="#A9C9E6" text-anchor="start">Music / Mastering</text><circle cx="100" cy="199" r="19" fill="#51462C" stroke="#E3CA85" stroke-width="1.7"/><text x="100" y="230" font-size="13" fill="#E4EDF5" text-anchor="middle">Audio mix</text><rect x="230" y="178" width="180" height="42" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="320.0" y="204" font-size="16" fill="#E4EDF5" text-anchor="middle">Normalize</text><rect x="510" y="178" width="180" height="42" rx="8" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="600.0" y="204" font-size="16" fill="#E4EDF5" text-anchor="middle">Measure</text><rect x="260" y="15" width="240" height="54" rx="27" fill="#385875" stroke="#A9C9E6" stroke-width="1.7"/><text x="380" y="37" font-size="16" fill="#E4EDF5" text-anchor="middle">LLM cognition</text><text x="380" y="55" font-size="13" fill="#A9C9E6" text-anchor="middle">Understanding and decision</text><path d="M100 180V93H300V69" fill="none" stroke="#A9C9E6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/><text x="110" y="85" font-size="14" fill="#A9C9E6" text-anchor="start">Perception</text><path d="M46