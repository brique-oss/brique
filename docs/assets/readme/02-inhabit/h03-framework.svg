<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">A cognitive framework makes the world intelligible.</title><desc id="desc">A shared framework and the Pilot-specific prompt are distinct contributions to the inference context.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="260" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="20" y="20" width="345" height="102" rx="8" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7"/><text x="36" y="43" font-size="17" fill="#527EA9" text-anchor="start">Shared Pilot framework</text><text x="36" y="72" font-size="15" fill="#354352" text-anchor="start">Retrieve · Read contracts · Discover</text><text x="36" y="96" font-size="15" fill="#354352" text-anchor="start">Interpret status · Responses are data</text><rect x="20" y="140" width="345" height="94" rx="8" fill="#EDF6EE" stroke="#598D69" stroke-width="1.7"/><text x="36" y="166" font-size="17" fill="#598D69" text-anchor="start">Pilot-specific prompt</text><text x="36" y="194" font-size="15" fill="#354352" text-anchor="start">Responsibility and dispositions</text><path d="M365 71H430V120H480" fill="none" stroke="#527EA9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/><path d="M365 187H430V140H480" fill="none" stroke="#527EA9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/><rect x="480" y="95" width="250" height="70" rx="35" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="605" y="125" font-size="18" fill="#354352" text-anchor="middle">LLM inference</text><text x="605" y="145" font-size="13" fill="#527EA9" text-anchor="middle">Context assembled by runtime</text></g></svg>