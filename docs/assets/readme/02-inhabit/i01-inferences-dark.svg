<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc"><title id="title">An inference is a moment, not an activity.</title><desc id="desc">Three separate inference moments along a time axis, with gaps between them.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#A9C9E6"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#F0B990"/></marker></defs><rect width="760" height="200" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><path d="M55 140H705" fill="none" stroke="#91A5B8" stroke-width="2"  /><rect x="77" y="78" width="96" height="44" rx="22" fill="#385875" stroke="#A9C9E6" stroke-width="1.7"/><text x="125" y="105" font-size="14" fill="#E4EDF5" text-anchor="middle">Inference</text><path d="M125 122V140" fill="none" stroke="#91A5B8" stroke-width="2" stroke-dasharray="3 3" /><rect x="332" y="78" width="96" height="44" rx="22" fill="#385875" stroke="#A9C9E6" stroke-width="1.7"/><text x="380" y="105" font-size="14" fill="#E4EDF5" text-anchor="middle">Inference</text><path d="M380 122V140" fill="none" stroke="#91A5B8" stroke-width="2" stroke-dasharray="3 3" /><rect x="587" y="78" width="96" height="44" rx="22" fill="#385875" stroke="#A9C9E6" stroke-width="1.7"/><text x="635" y="105" font-size="14" fill="#E4EDF5" text-anchor="middle">Inference</text><path d="M635 122V140" fill="none" stroke="#91A5B8" stroke-width="2" stroke-dasharray="3 3" /><text x="380" y="175" font-size="15" fill="#A9C9E6" text-anchor="middle">Time</text></g></svg>