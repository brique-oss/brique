<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">The initial intention gives the activity its founding direction.</title><desc id="desc">An immutable initial intention remains above the entire course of a Continuity.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="210" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="20" y="15" width="720" height="43" rx="8" fill="#FFF0E6" stroke="#B97B4E" stroke-width="1.7"/><text x="380" y="42" font-size="17" fill="#354352" text-anchor="middle">Initial intention · Prepare a master</text><path d="M380 58V78" fill="none" stroke="#91A5B8" stroke-width="2" stroke-dasharray="4 3" /><rect x="20" y="78" width="720" height="112" rx="8" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7"/><text x="35" y="99" font-size="15" fill="#527EA9" text-anchor="start">Continuity</text><path d="M75 133H685" fill="none" stroke="#91A5B8" stroke-width="2"  /><rect x="77" y="111" width="96" height="44" rx="22" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="125" y="138" font-size="14" fill="#354352" text-anchor="middle">Inference</text><rect x="332" y="111" width="96" height="44" rx="22" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="380" y="138" font-size="14" fill="#354352" text-anchor="middle">Inference</text><rect x="587" y="111" width="96" height="44" rx="22" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="635" y="138" font-size="14" fill="#354352" text-anchor="middle">Inference</text></g></svg>