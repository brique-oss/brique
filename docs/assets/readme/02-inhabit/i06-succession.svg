<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc"><title id="title">An activity can continue through succession.</title><desc id="desc">An archived source Continuity and an active successor linked by an explicitly produced summary, preserving the founding intention.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="240" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="720" height="40" rx="8" fill="#FFF0E6" stroke="#B97B4E" stroke-width="1.7"/><text x="380" y="37" font-size="16" fill="#354352" text-anchor="middle">Same founding intention</text><rect x="20" y="78" width="320" height="142" rx="8" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7"/><text x="35" y="99" font-size="16" fill="#527EA9" text-anchor="start">Source · archived</text><rect x="35" y="120" width="64" height="35" rx="8" fill="#E5EBF2" stroke="#91A5B8" stroke-width="1.7"/><text x="67" y="142" font-size="14" fill="#354352" text-anchor="middle">1</text><rect x="107" y="120" width="64" height="35" rx="8" fill="#E5EBF2" stroke="#91A5B8" stroke-width="1.7"/><text x="139" y="142" font-size="14" fill="#354352" text-anchor="middle">2</text><rect x="179" y="120" width="64" height="35" rx="8" fill="#E5EBF2" stroke="#91A5B8" stroke-width="1.7"/><text x="211" y="142" font-size="14" fill="#354352" text-anchor="middle">3</text><rect x="251" y="120" width="64" height="35" rx="8" fill="#E5EBF2" stroke="#91A5B8" stroke-width="1.7"/><text x="283" y="142" font-size="14" fill="#354352" text-anchor="middle">4</text><text x="180" y="190" font-size="15" fill="#354352" text-anchor="middle">Journal preserved</text><rect x="420" y="78" width="320" height="142"