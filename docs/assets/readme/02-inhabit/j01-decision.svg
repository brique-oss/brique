<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">A cognitive decision is structured before it becomes effective.</title><desc id="desc">An inference produces a structured decision; validation separates invalid decisions from executable ones.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="210" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><ellipse cx="100" cy="105" rx="76" ry="25" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="100" y="110" font-size="16" fill="#354352" text-anchor="middle">Inference</text><path d="M176 105H210" stroke="#527EA9" stroke-width="2" fill="none" marker-end="url(#b)"/><rect x="210" y="24" width="235" height="162" rx="7" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="327" y="46" font-size="16" fill="#354352" text-anchor="middle">Structured decision</text><rect x="225" y="58" width="205" height="24" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="327.5" y="75.0" font-size="16" fill="#354352" text-anchor="middle">Current intention</text><rect x="225" y="87" width="205" height="24" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="327.5" y="104.0" font-size="16" fill="#354352" text-anchor="middle">Projection / invocations</text><rect x="225" y="116" width="205" height="24" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="327.5" y="133.0" font-size="16" fill="#354352" text-anchor="middle">Wait condition</text><rect x="225" y="145" width="205" height="24" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="327.5" y="162.0" font-size="16" fill="#354352" text-anchor="middle">Addressed messages</text><path d="M445 105H475" stroke="#527EA9" stroke-width="2" fill="none" marker-end="url(#b)"/><rect x="475" y="82" width="112" height="46" rx="7" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7" /><text x="531.0" y="110.0" font-size="16" fill="#354352" text-anchor="middle">Validation</text><path d="M587 105H608V48H628" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><rect x="628" y="28" width="112" height="40" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="684.0" y="53.0" font-size="16" fill="#354352" text-anchor="middle">Apply</text><path d="M587 105H608V161H628" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><rect x="628" y="141" width="112" height="40" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="684.0" y="166.0" font-size="16" fill="#354352" text-anchor="middle">Correct / fail</text></g></svg>