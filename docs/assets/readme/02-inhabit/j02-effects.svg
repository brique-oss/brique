<svg xmlns="http://www.w3.org/2000/svg" width="760" height="214" viewBox="0 0 760 214" role="img" aria-labelledby="title desc"><title id="title">Real effects remain facts.</title><desc id="desc">Three successive operations: the first succeeds and changes substance, the second fails, and the third is not reached.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="214" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="12" y="12" width="736" height="190" rx="7" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="28" y="34" font-size="16" fill="#527EA9" text-anchor="start">One course of execution</text><rect x="34" y="63" width="180" height="42" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="124.0" y="89.0" font-size="16" fill="#354352" text-anchor="middle">Normalize</text><rect x="290" y="63" width="180" height="42" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="380.0" y="89.0" font-size="16" fill="#354352" text-anchor="middle">Measure</text><rect x="546" y="63" width="180" height="42" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" stroke-dasharray="5 4"/><text x="636" y="89" font-size="16" fill="#91A5B8" text-anchor="middle">Check format</text><path d="M214 84H290" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><path d="M470 84H546" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 4" /><text x="124" y="130" font-size="15" fill="#598D69" text-anchor="middle">Succeeded</text><text x="380" y="130" font-size="15" fill="#B97B4E" text-anchor="middle">Failed</text><text x="636" y="130" font-size="15" fill="#91A5B8" text-anchor="middle">Not reached</text><circle cx="124" cy="164" r="20" fill="#F8E8AC" stroke="#AD943D"/><text x="154" y="169" font-size="15" fill="#AD943D" text-anchor="start">Effect preserved</text><text x="380" y="190" font-size="15" fill="#527EA9" text-anchor="middle">Resume from actual state</text></g></svg>