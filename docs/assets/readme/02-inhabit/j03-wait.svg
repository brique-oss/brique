<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244" role="img" aria-labelledby="title desc"><title id="title">Waiting suspends progress, not the existence of the activity.</title><desc id="desc">Two operations are launched, a wait group receives their correlated results, and an inference resumes once the condition is satisfied.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="244" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="12" y="12" width="736" height="220" rx="7" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="27" y="34" font-size="16" fill="#527EA9" text-anchor="start">Continuity</text><ellipse cx="100" cy="75" rx="76" ry="25" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="100" y="80" font-size="16" fill="#354352" text-anchor="middle">Inference</text><ellipse cx="660" cy="75" rx="76" ry="25" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="660" y="80" font-size="16" fill="#354352" text-anchor="middle">Resumption</text><rect x="213" y="52" width="334" height="47" rx="7" fill="#FFFFFF" stroke="#527EA9" stroke-width="1.7" stroke-dasharray="5 4"/><text x="380" y="72" font-size="16" fill="#527EA9" text-anchor="middle">Waiting · no active inference</text><text x="380" y="89" font-size="13" fill="#527EA9" text-anchor="middle">all</text><path d="M176 75H213" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><path d="M547 75H584" stroke="#527EA9" stroke-width="2" fill="none" marker-end="url(#b)"/><rect x="183" y="153" width="180" height="40" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="273.0" y="178.0" font-size="16" fill="#354352" text-anchor="middle">Measure loudness</text><rect x="397" y="153" width="180" height="40" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="487.0" y="178.0" font-size="16" fill="#354352" text-anchor="middle">Check format</text><path d="M100 100V130H273V153" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><path d="M100 130H487V153" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><path d="M363 173H380V99" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><path d="M397 173H380" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" /><text x="380" y="218" font-size="14" fill="#527EA9" text-anchor="middle">Correlated responses</text></g></svg>