<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="title desc"><title id="title">The mailbox schedules work; the journal preserves its history.</title><desc id="desc">Incoming events enter a mailbox containing references, while full messages reside in the journal. One active chain consumes its current message.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="268" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="12" y="12" width="736" height="244" rx="7" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="27" y="34" font-size="16" fill="#527EA9" text-anchor="start">Continuity</text><rect x="28" y="48" width="704" height="53" rx="7" fill="#FFFFFF" stroke="#527EA9" stroke-width="1.7" /><text x="42" y="70" font-size="15" fill="#527EA9" text-anchor="start">Journal · complete messages</text><rect x="350" y="60" width="82" height="28" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="391.0" y="79.0" font-size="16" fill="#354352" text-anchor="middle">Request</text><rect x="441" y="60" width="82" height="28" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="482.0" y="79.0" font-size="16" fill="#354352" text-anchor="middle">Response</text><rect x="532" y="60" width="82" height="28" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="573.0" y="79.0" font-size="16" fill="#354352" text-anchor="middle">Message</text><rect x="623" y="60" width="82" height="28" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="664.0" y="79.0" font-size="16" fill="#354352" text-anchor="middle">Control</text><rect x="28" y="121" width="410" height="94" rx="7" fill="#FFF0E6" stroke="#B97B4E" stroke-width="1.7" /><text x="42" y="143" font-size="15" fill="#B97B4E" text-anchor="start">Mailbox · references and consumption</text><rect x="44" y="163" width="113" height="35" rx="7" fill="#F5D0B4" stroke="#B97B4E" stroke-width="1.7" /><text x="100.5" y="185.5" font-size="16" fill="#354352" text-anchor="middle">Claimed</text><rect x="169" y="163" width="113" height="35" rx="7" fill="#F5D0B4" stroke="#B97B4E" stroke-width="1.7" /><text x="225.5" y="185.5" font-size="16" fill="#354352" text-anchor="middle">Expected</text><rect x="294" y="163" width="113" height="35" rx="7" fill="#F5D0B4" stroke="#B97B4E" stroke-width="1.7" /><text x="350.5" y="185.5" font-size="16" fill="#354352" text-anchor="middle">Pending</text><path d="M391 88V110H100V163" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="3 4" marker-end="url(#b)"/><path d="M482 88V110H225V163" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="3 4" marker-end="url(#b)"/><path d="M573 88V110H350V163" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="3 4" marker-end="url(#b)"/><rect x="494" y="163" width="222" height="35" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="605.0" y="185.5" font-size="16" fill="#354352" text-anchor="middle">One active cognitive chain</text><path d="M157 198V231H605V198" stroke="#B97B4E" stroke-width="2" fill="none" marker-end="url(#o)"/><text x="605" y="147" font-size="15" fill="#527EA9" text-anchor="middle">Runtime</text></g></svg>