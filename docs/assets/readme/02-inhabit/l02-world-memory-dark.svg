<svg xmlns="http://www.w3.org/2000/svg" width="760" height="258" viewBox="0 0 760 258" role="img" aria-labelledby="title desc"><title id="title">Experience belongs to the world, not to an agent identity.</title><desc id="desc">One situated experience Document persists between two independent activities.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#A9C9E6"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#F0B990"/></marker></defs><rect width="760" height="258" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="15" y="12" width="330" height="76" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" /><text x="27" y="32" font-size="14" fill="#A9C9E6" text-anchor="start">Earlier activity</text><path d="M35 60H325" stroke="#91A5B8" stroke-width="2" fill="none" /><circle cx="45.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="135.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="225.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="315.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><rect x="415" y="12" width="330" height="76" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" /><text x="427" y="32" font-size="14" fill="#A9C9E6" text-anchor="start">Later activity</text><path d="M435 60H725" stroke="#91A5B8" stroke-width="2" fill="none" /><circle cx="445.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="535.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="625.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><circle cx="715.0" cy="60" r="7" fill="#385875" stroke="#A9C9E6"/><rect x="130" y="115" width="500" height="130" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" /><text x="145" y="137" font-size="15" fill="#A9C9E6" text-anchor="start">Mastering Context</text><path d="M350 150h42l18 18v48h-60Z M392 150v18h18" fill="#5