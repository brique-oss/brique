<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">An experience can be perceived at three depths.</title><desc id="desc">Three nested representations show a short evocation, longer description and full factual experience.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#A9C9E6"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#F0B990"/></marker></defs><rect width="760" height="228" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="720" height="204" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" /><text x="35" y="34" font-size="16" fill="#A9C9E6" text-anchor="start">Experience Document</text><rect x="35" y="45" width="690" height="155" rx="7" fill="#202D38" stroke="#91A5B8" stroke-width="1.7" /><text x="50" y="66" font-size="15" fill="#A9C9E6" text-anchor="start">Full experience · circumstances and facts</text><rect x="50" y="79" width="660" height="106" rx="7" fill="#3B3525" stroke="#E3CA85" stroke-width="1.7" /><text x="65" y="102" font-size="15" fill="#E3CA85" text-anchor="start">Description · enough to orient understanding</text><rect x="65" y="119" width="630" height="43" rx="7" fill="#51462C" stroke="#E3CA85" stroke-width="1.7" /><text x="380.0" y="145.5" font-size="16" fill="#E4EDF5" text-anchor="middle">Evocation · audible distortion after normalization</text></g></svg>