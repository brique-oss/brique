<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">An experience can be perceived at three depths.</title><desc id="desc">Three nested representations show a short evocation, longer description and full factual experience.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="228" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="720" height="204" rx="7" fill="#EDF4FC" stroke="#527EA9" stroke-width="1.7" /><text x="35" y="34" font-size="16" fill="#527EA9" text-anchor="start">Experience Document</text><rect x="35" y="45" width="690" height="155" rx="7" fill="#FFFFFF" stroke="#91A5B8" stroke-width="1.7" /><text x="50" y="66" font-size="15" fill="#527EA9" text-anchor="start">Full experience · circumstances and facts</text><rect x="50" y="79" width="660" height="106" rx="7" fill="#FFF9E5" stroke="#AD943D" stroke-width="1.7" /><text x="65" y="102" font-size="15" fill="#AD943D" text-anchor="start">Description · enough to orient understanding</text><rect x="65" y="119" width="630" height="43" rx="7" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7" /><text x="380.0" y="145.5" font-size="16" fill="#354352" text-anchor="middle">Evocation · audible distortion after normalization</text></g></svg>