<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc"><title id="title">An experience is situated and can relate to several elements.</title><desc id="desc">A single experience in Mastering has explicit associations with a Capacity and a Matter in other Contexts.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#A9C9E6"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#F0B990"/></marker></defs><rect width="760" height="200" rx="12" fill="#1D2730"/><g font-family="Arial, sans-serif"><rect x="12" y="12" width="736" height="176" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7" /><rect x="25" y="36" width="260" height="140" rx="7" fill="#202D38" stroke="#A9C9E6" stroke-width="1.7" /><text x="40" y="56" font-size="15" fill="#A9C9E6" text-anchor="start">Mastering</text><path d="M125 68h42l18 18v48h-60Z M167 68v18h18" fill="#51462C" stroke="#E3CA85" stroke-width="1.7"/><text x="155" y="153" font-size="14" fill="#E4EDF5" text-anchor="middle">Experience</text><rect x="320" y="36" width="415" height="140" rx="7" fill="#202D38" stroke="#A9C9E6" stroke-width="1.7" /><text x="335" y="56" font-size="15" fill="#A9C9E6" text-anchor="start">Related Contexts</text><rect x="350" y="80" width="160" height="40" rx="7" fill="#355644" stroke="#ADD6B7" stroke-width="1.7" /><text x="430.0" y="105.0" font-size="16" fill="#E4EDF5" text-anchor="middle">Check format</text><circle cx="650" cy="100" r="24" fill="#51462C" stroke="#E3CA85"/><text x="650" y="145" font-size="14" fill="#E4EDF5" text-anchor="middle">Audio mix</text><path d="M185 96H350" stroke="#91A5B8" stroke-width="2" fill="none" stroke-dasharray="3 4" /><path d="M185 120H300V158H650V124" stroke="#91A5B8" stroke-width="2" fill="none" stroke-dasharray="3 4" /></g></svg>