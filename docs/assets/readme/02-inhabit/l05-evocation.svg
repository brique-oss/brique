<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-labelledby="title desc"><title id="title">Experience can be sought or evoked by an encounter.</title><desc id="desc">Voluntary semantic search and a real element encounter lead to a short evocation; the Pilot may request deeper content.</desc><defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527EA9"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B97B4E"/></marker></defs><rect width="760" height="170" rx="12" fill="#FAFBF8"/><g font-family="Arial, sans-serif"><rect x="15" y="22" width="210" height="40" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7" /><text x="120.0" y="47.0" font-size="16" fill="#354352" text-anchor="middle">Voluntary semantic search</text><rect x="15" y="109" width="210" height="40" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7" /><text x="120.0" y="134.0" font-size="16" fill="#354352" text-anchor="middle">Actual element encounter</text><path d="M225 42H250V85H280" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><path d="M225 129H250V85H280" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><rect x="280" y="64" width="170" height="42" rx="7" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7" /><text x="365.0" y="90.0" font-size="16" fill="#354352" text-anchor="middle">Short evocation</text><path d="M450 85H476" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><path d="M510 51l30 17v34l-30 17-30-17v-34Z" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="510" y="90" font-size="13" fill="#354352" text-anchor="middle">Pilot</text><path d="M540 85H582" stroke="#527EA9" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#b)"/><path d="M625 51h42l18 18v48h-60Z M667 51v18h18" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="655" y="136" font-size="14" fill="#354352" text-anchor="middle">Read if useful</text><text x="510" y="143" font-size="14" fill="#527EA9" text-anchor="middle">Decides</text></g></svg>