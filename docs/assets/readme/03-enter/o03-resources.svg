<svg xmlns="http://www.w3.org/2000/svg" width="760" height="130" viewBox="0 0 760 130" role="img"><title>Architecture, generated runtime resources and private identity have different preservation responsibilities.</title><rect width="760" height="130" rx="12" fill="#FAFBF8"/><g font-family="Arial,sans-serif"><rect x="15" y="18" width="230" height="44" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="130.0" y="45.0" font-size="16" fill="#354352" text-anchor="middle">Architecture</text><rect x="265" y="18" width="230" height="44" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7"/><text x="380.0" y="45.0" font-size="16" fill="#354352" text-anchor="middle">Generated resources</text><rect x="515" y="18" width="230" height="44" rx="7" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="630.0" y="45.0" font-size="16" fill="#354352" text-anchor="middle">Private identity</text><text x="130" y="88" font-size="14" fill="#354352" text-anchor="middle">Descriptors</text><text x="130" y="110" font-size="14" fill="#354352" text-anchor="middle">Code and Documents</text><text x="380" y="88" font-size="14" fill="#354352" text-anchor="middle">Binaries</text><text x="380" y="110" font-size="14" fill="#354352" text-anchor="middle">Build artifacts</text><text x="630" y="88" font-size="14" fill="#354352" text-anchor="middle">Keys and secrets</text><text x="630" y="110" font-size="14" fill="#354352" text-anchor="middle">Private substance</text></g></svg>