<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img"><title>A granted scope contains an explicit exception; another scope is outside the grant.</title><rect width="760" height="170" rx="12" fill="#1D2730"/><g font-family="Arial,sans-serif"><rect x="15" y="10" width="730" height="145" rx="7" fill="#283B4C" stroke="#A9C9E6" stroke-width="1.7"/><rect x="30" y="25" width="440" height="115" rx="7" fill="#253B32" stroke="#ADD6B7" stroke-width="1.7"/><text x="250" y="46" font-size="16" fill="#ADD6B7" text-anchor="middle">Granted scope</text><rect x="50" y="65" width="400" height="48" rx="7" fill="#654636" stroke="#F0B990" stroke-width="1.7"/><text x="250.0" y="94.0" font-size="16" fill="#E4EDF5" text-anchor="middle">Explicit exception</text><rect x="490" y="25" width="240" height="115" rx="7" fill="#202D38" stroke="#A9C9E6" stroke-width="1.7"/><text x="610" y="85" font-size="16" fill="#A9C9E6" text-anchor="middle">Other scope</text></g></svg>