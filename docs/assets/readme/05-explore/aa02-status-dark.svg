<svg xmlns="http://www.w3.org/2000/svg" width="760" height="105" viewBox="0 0 760 105" role="img"><title>Three distinct statuses: implemented mechanisms, designs under development, and research hypotheses.</title><rect width="760" height="105" rx="12" fill="#1D2730"/><g font-family="Arial,sans-serif"><rect x="15" y="15" width="230" height="45" rx="7" fill="#355644" stroke="#ADD6B7" stroke-width="1.7"/><text x="130.0" y="42.5" font-size="16" fill="#E4EDF5" text-anchor="middle">Implemented</text><rect x="265" y="15" width="230" height="45" rx="7" fill="#51462C" stroke="#E3CA85" stroke-width="1.7"/><text x="380.0" y="42.5" font-size="16" fill="#E4EDF5" text-anchor="middle">Under design</text><rect x="515" y="15" width="230" height="45" rx="7" fill="#385875" stroke="#A9C9E6" stroke-width="1.7"/><text x="630.0" y="42.5" font-size="16" fill="#E4EDF5" text-anchor="middle">Research hypothesis</text><text x="130" y="87" font-size="14" fill="#E4EDF5" text-anchor="middle">Code and contracts</text><text x="380" y="87" font-size="14" fill="#E4EDF5" text-anchor="middle">Proposed mechanisms</text><text x="630" y="87" font-size="14" fill="#E4EDF5" text-anchor="middle">Experimental questions</text></g></svg>