<svg xmlns="http://www.w3.org/2000/svg" width="760" height="105" viewBox="0 0 760 105" role="img"><title>Three distinct statuses: implemented mechanisms, designs under development, and research hypotheses.</title><rect width="760" height="105" rx="12" fill="#FAFBF8"/><g font-family="Arial,sans-serif"><rect x="15" y="15" width="230" height="45" rx="7" fill="#C7E4CE" stroke="#598D69" stroke-width="1.7"/><text x="130.0" y="42.5" font-size="16" fill="#354352" text-anchor="middle">Implemented</text><rect x="265" y="15" width="230" height="45" rx="7" fill="#F8E8AC" stroke="#AD943D" stroke-width="1.7"/><text x="380.0" y="42.5" font-size="16" fill="#354352" text-anchor="middle">Under design</text><rect x="515" y="15" width="230" height="45" rx="7" fill="#C6DCF3" stroke="#527EA9" stroke-width="1.7"/><text x="630.0" y="42.5" font-size="16" fill="#354352" text-anchor="middle">Research hypothesis</text><text x="130" y="87" font-size="14" fill="#354352" text-anchor="middle">Code and contracts</text><text x="380" y="87" font-size="14" fill="#354352" text-anchor="middle">Proposed mechanisms</text><text x="630" y="87" font-size="14" fill="#354352" text-anchor="middle">Experimental questions</text></g></svg>