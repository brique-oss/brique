<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Spark</title>
    <script>
      const rendererPayload = process.env.SPARK_RENDERER_PAYLOAD
        ? JSON.parse(process.env.SPARK_RENDERER_PAYLOAD)
        : {};
      const adapterImportMap = rendererPayload.adapterImportMap
        ? rendererPayload.adapterImportMap
        : process.env.SPARK_ADAPTER_IMPORT_MAP
          ? JSON.parse(process.env.SPARK_ADAPTER_IMPORT_MAP)
        : {};
      const adapterStyleUrls = rendererPayload.adapterStyleUrls
        ? rendererPayload.adapterStyleUrls
        : process.env.SPARK_ADAPTER_STYLE_URLS
          ? JSON.parse(process.env.SPARK_ADAPTER_STYLE_URLS)
        : [];
      const importMapScript = document.createElement("script");
      importMapScript.type = "importmap";
      importMapScript.textContent = JSON.stringify({ imports: adapterImportMap });
      document.currentScript.after(importMapScript);
      for (const href of adapterStyleUrls) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
